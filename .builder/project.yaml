name: PagePilot
idea: Local-first iOS ebook reader with Apple Watch page-turn control.
current_stage: 10-growth-channel
target_wedge: iPhone/iPad readers who want hands-free page turning with Apple Watch.
core_user: Apple ecosystem readers who read in bed, at the gym, during commutes, or with their device on a stand.
core_pain: Touching the screen to turn pages breaks posture, comfort, and reading flow.
core_action: Import a local book, open it in PagePilot, and turn pages from Apple Watch.
