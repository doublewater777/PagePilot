name: PagePilot
options:
  bundleIdPrefix: org.readium
  schemePathPrefix: ../../
fileGroups:
  - PagePilot.storekit
packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm.git
    exactVersion: 5.94.0
  Readium:
    url: https://github.com/readium/swift-toolkit.git
    PACKAGE_VERSION
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    from: 6.9.23
  Kingfisher:
    url: https://github.com/onevcat/Kingfisher.git
    from: 5.15.8
  MBProgressHUD:
    url: https://github.com/jdg/MBProgressHUD.git
    from: 1.2.0
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup.git
    from: 2.3.2
  Ink:
    url: https://github.com/JohnSundell/Ink.git
    from: 0.6.0
  ZIPFoundation:
    url: https://github.com/readium/ZIPFoundation.git
    from: 3.0.1
schemes:
  PagePilot:
    preActions:
      - name: Patch SPM watchOS platforms
        settingsTarget: PagePilot
        script: |
          "${SRCROOT}/scripts/patch-spm-watchos-platforms.sh"
    build:
      targets:
        PagePilot: all
        PagePilotTests: [test]
    test:
      targets:
        - PagePilotTests
    run:
      storeKitConfiguration: PagePilot.storekit
targets:
  PagePilot:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: iPhone
      - path: Sources
        excludes:
          - Resources/Fonts
      - path: Sources/Resources/Fonts
        type: folder
      - path: Shared
      - path: LiveActivityShared
    dependencies:
      - package: RevenueCat
      - target: PagePilotWatch
        platformFilter: iOS
      - target: PagePilotLiveActivity
        platformFilter: iOS
      - package: Readium
        product: ReadiumShared
      - package: Readium
        product: ReadiumStreamer
      - package: Readium
        product: ReadiumNavigator
      - package: Readium
        product: ReadiumAdapterGCDWebServer
      - package: Readium
        product: ReadiumOPDS
      - package: Readium
        product: ReadiumLCP
      - package: GRDB
      - package: Kingfisher
      - package: MBProgressHUD
      - package: SwiftSoup
      - package: Ink
      - package: ZIPFoundation
        product: ReadiumZIPFoundation
    configFiles:
      Debug: Integrations/SPM/CloudKit.Debug.xcconfig
      Release: Integrations/SPM/CloudKit.Release.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.panyang.PagePilot
        DEVELOPMENT_TEAM: ${RD_DEVELOPMENT_TEAM}
        CODE_SIGN_ENTITLEMENTS: iPhone/pagepilot.entitlements
        INFOPLIST_FILE: iPhone/Info.plist
        SUPPORTS_MACCATALYST: YES
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Mac/PagePilot.entitlements
        "CODE_SIGN_IDENTITY[sdk=macosx*]": Apple Development
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.reference
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: PagePilot uses the local network to transfer books and connect to your iPad or Mac reader for Apple Watch page controls.
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        MARKETING_VERSION: 1.0.24
        CURRENT_PROJECT_VERSION: 52
      configs:
        Debug:
          "CODE_SIGN_STYLE[sdk=macosx*]": Manual
          "PROVISIONING_PROFILE_SPECIFIER[sdk=macosx*]": PagePilot Mac Catalyst Development
          APS_ENVIRONMENT: development
        Release:
          CODE_SIGN_STYLE: Manual
          "CODE_SIGN_IDENTITY[sdk=iphoneos*]": Apple Distribution
          "PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]": "PagePilot App App Store 1.0.24"
          "CODE_SIGN_IDENTITY[sdk=macosx*]": Apple Distribution
          "PROVISIONING_PROFILE_SPECIFIER[sdk=macosx*]": PagePilot Mac Catalyst App Store
          APS_ENVIRONMENT: production
  PagePilotWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: WatchRemote
      - path: Shared
    settings:
      base:
        INFOPLIST_FILE: WatchRemote/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.panyang.PagePilot.WatchRemote
        DEVELOPMENT_TEAM: ${RD_DEVELOPMENT_TEAM}
        CODE_SIGN_STYLE: Manual
        MARKETING_VERSION: 1.0.24
      CURRENT_PROJECT_VERSION: 52
      configs:
        Debug:
          CODE_SIGN_IDENTITY: Apple Development
          PROVISIONING_PROFILE_SPECIFIER: PagePilot Watch Development
        Release:
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: "PagePilot Watch App Store 1.0.24"

  PagePilotLiveActivity:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ReadingLiveActivity
      - path: LiveActivityShared
    settings:
      base:
        INFOPLIST_FILE: ReadingLiveActivity/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.panyang.PagePilot.ReadingLiveActivity
        DEVELOPMENT_TEAM: ${RD_DEVELOPMENT_TEAM}
        MARKETING_VERSION: 1.0.24
        CURRENT_PROJECT_VERSION: 52
        SKIP_INSTALL: YES
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: "PagePilot ReadingLiveActivity App Store 1.0.24"

  PagePilotTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests
      - path: PagePilot.storekit
        buildPhase: resources
    dependencies:
      - target: PagePilot
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.panyang.PagePilotTests
      DEVELOPMENT_TEAM: ${RD_DEVELOPMENT_TEAM}
      GENERATE_INFOPLIST_FILE: YES
