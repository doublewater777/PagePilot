name: PagePilot
options:
  bundleIdPrefix: org.readium
  schemePathPrefix: ../../../
fileGroups:
  - PagePilot.storekit
packages:
  Ink:
    url: https://github.com/JohnSundell/Ink.git
    from: 0.6.0
  ZIPFoundation:
    url: https://github.com/readium/ZIPFoundation.git
    from: 3.0.1
schemes:
  PagePilot:
    build:
      targets:
        PagePilot: all
    run:
      storeKitConfiguration: PagePilot.storekit
targets:
  PagePilot:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: iPhone
      - path: Sources
        excludes:
          - Resources/Fonts
      - path: Sources/Resources/Fonts
        type: folder
      - path: Shared
    dependencies:
      - target: PagePilotWatch
      - package: Ink
      - package: ZIPFoundation
        product: ReadiumZIPFoundation
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.panyang.PagePilot
      DEVELOPMENT_TEAM: ${RD_DEVELOPMENT_TEAM}

  PagePilotWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: WatchRemote
      - path: Shared
    settings:
      INFOPLIST_FILE: WatchRemote/Info.plist
      PRODUCT_BUNDLE_IDENTIFIER: com.panyang.PagePilot.WatchRemote
      DEVELOPMENT_TEAM: ${RD_DEVELOPMENT_TEAM}
