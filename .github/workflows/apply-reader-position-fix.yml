name: Apply reader position footer fix

on:
  push:
    branches:
      - fix/home-nav-bar-inset
    paths:
      - .github/workflows/apply-reader-position-fix.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore: add temporary reader position patch workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/home-nav-bar-inset
          fetch-depth: 0

      - name: Replace percentage footer with position footer
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('Sources/Reader/Common/VisualReaderViewController.swift')
          text = path.read_text(encoding='utf-8')
          pattern = re.compile(
              r'        positionLabel\.text = \{\n.*?        \}\(\)\n',
              re.DOTALL,
          )
          replacement = '''        positionLabel.text = {
              guard let positionCount = positionCount,
                    let position = locator.locations.position
              else {
                  return nil
              }

              if positionsArePages {
                  // PDF / fixed-layout: positions are actual page numbers.
                  return "\\(position) / \\(positionCount)"
              }

              // Reflowable publications use Readium positions. Keep the
              // footer stable instead of switching to a percentage.
              return String(
                  format: NSLocalizedString(
                      "reader_position_format",
                      comment: "Reader footer: current reading position out of total positions"
                  ),
                  position,
                  positionCount
              )
          }()
'''
          updated, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Expected one footer block, replaced {count}')
          path.write_text(updated, encoding='utf-8')

      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Sources/Reader/Common/VisualReaderViewController.swift
          git commit -m "fix: keep reader footer on positions"
          git push origin HEAD:fix/home-nav-bar-inset
